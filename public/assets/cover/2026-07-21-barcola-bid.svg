<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Editorial plate: a solitary winger held under floodlights at the edge of a wide empty pitch, a negotiation suspended">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060b14"/>
      <stop offset="46%" stop-color="#101c2b"/>
      <stop offset="100%" stop-color="#1d0b12"/>
    </linearGradient>
    <radialGradient id="flood" cx="0.72" cy="0.13" r="0.82">
      <stop offset="0%" stop-color="#f4e6cb" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#f4e6cb" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f4e6cb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="counterflood" cx="0.18" cy="0.20" r="0.55">
      <stop offset="0%" stop-color="#8fb6d8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8fb6d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.64"/>
      <stop offset="42%" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2a1f" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#040e0a" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1216" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0a0508" stop-opacity="0.99"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#counterflood)"/>
  <rect width="1600" height="900" fill="url(#flood)"/>

  <!-- distant stand tiers, dissolving into the dark -->
  <g opacity="0.30">
    <rect x="0" y="196" width="1600" height="86" fill="#0c1622"/>
    <rect x="0" y="292" width="1600" height="72" fill="#0a131d"/>
    <g fill="#f4e6cb" opacity="0.10">
      <rect x="60" y="210" width="1480" height="2"/>
      <rect x="60" y="238" width="1480" height="2"/>
      <rect x="60" y="266" width="1480" height="2"/>
      <rect x="60" y="306" width="1480" height="2"/>
      <rect x="60" y="334" width="1480" height="2"/>
    </g>
  </g>

  <!-- floodlight pylons, right dominant / left answering -->
  <g opacity="0.5" filter="url(#soft)">
    <ellipse cx="1156" cy="118" rx="150" ry="58" fill="#f4e6cb" opacity="0.20"/>
    <ellipse cx="292" cy="176" rx="112" ry="46" fill="#8fb6d8" opacity="0.13"/>
  </g>

  <!-- turf -->
  <rect x="0" y="562" width="1600" height="338" fill="url(#turf)"/>
  <g opacity="0.09" fill="#dfeee4">
    <rect x="0" y="596" width="1600" height="2"/>
    <rect x="0" y="662" width="1600" height="2"/>
    <rect x="0" y="748" width="1600" height="2"/>
  </g>
  <!-- touchline, running out of frame: the line he plays on -->
  <rect x="0" y="700" width="1600" height="3" fill="#dfeee4" opacity="0.20"/>

  <!-- the solitary figure, wide right, isolated in the light: a winger waiting on a number -->
  <g filter="url(#soft)" opacity="0.34">
    <ellipse cx="1108" cy="742" rx="96" ry="20" fill="#000"/>
  </g>
  <g fill="url(#figure)">
    <ellipse cx="1108" cy="470" rx="25" ry="28"/>
    <path d="M1083 506 q25 -16 50 0 l17 92 q-42 15 -84 0 z"/>
    <path d="M1085 512 l-42 74 q-6 13 6 19 q12 5 19 -7 l35 -62 z"/>
    <path d="M1131 512 l44 70 q7 13 -5 20 q-12 5 -19 -7 l-36 -60 z"/>
    <path d="M1092 596 l-13 116 q-2 15 12 16 q13 1 16 -14 l14 -96 z"/>
    <path d="M1124 596 l16 112 q3 15 -10 17 q-13 2 -17 -13 l-16 -98 z"/>
  </g>

  <!-- a second figure, far left, half-lit and out of focus: the alternative held in reserve -->
  <g fill="#0a1016" opacity="0.55" filter="url(#softer)">
    <ellipse cx="322" cy="512" rx="20" ry="23"/>
    <path d="M302 544 q20 -13 40 0 l13 76 q-33 12 -67 0 z"/>
    <path d="M310 622 l-10 92 l22 0 l12 -78 z"/>
    <path d="M336 622 l13 90 l21 -2 l-14 -86 z"/>
  </g>

  <!-- suspended particles: nothing has landed yet -->
  <g fill="#f4e6cb" opacity="0.16">
    <circle cx="1268" cy="322" r="2.5"/><circle cx="1352" cy="404" r="2"/>
    <circle cx="1188" cy="252" r="1.8"/><circle cx="1424" cy="296" r="2.2"/>
    <circle cx="964" cy="356" r="2"/><circle cx="1036" cy="286" r="1.6"/>
    <circle cx="612" cy="330" r="1.8"/><circle cx="708" cy="268" r="1.5"/>
    <circle cx="486" cy="392" r="2"/><circle cx="1500" cy="368" r="1.7"/>
  </g>

  <rect width="1600" height="900" fill="url(#scrim)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
