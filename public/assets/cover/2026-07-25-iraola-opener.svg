<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Editorial plate: a floodlit stadium at night seen from an empty touchline, a single figure standing in the technical area as a new season's first match is about to begin">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1017"/>
      <stop offset="46%" stop-color="#182634"/>
      <stop offset="100%" stop-color="#2c1f1a"/>
    </linearGradient>
    <radialGradient id="flood" cx="0.5" cy="0.16" r="0.62">
      <stop offset="0%" stop-color="#eef3ff" stop-opacity="0.85"/>
      <stop offset="34%" stop-color="#cdd9f0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#cdd9f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#25412d"/>
      <stop offset="100%" stop-color="#0f1a13"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef3ff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#eef3ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dawn" cx="0.5" cy="1.0" r="0.7">
      <stop offset="0%" stop-color="#e9a24e" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#e9a24e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- night sky over the bowl -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- far grandstand, a dark mass flecked with crowd light -->
  <rect x="0" y="150" width="1600" height="300" fill="#0e151d"/>
  <g fill="#3a4a60" opacity="0.5">
    <rect x="90" y="250" width="1420" height="2"/>
    <rect x="120" y="300" width="1360" height="2"/>
    <rect x="150" y="350" width="1300" height="2"/>
  </g>

  <!-- floodlight glow banks across the top -->
  <ellipse cx="800" cy="120" rx="900" ry="260" fill="url(#flood)"/>
  <g fill="#eef3ff" opacity="0.9">
    <rect x="300" y="70" width="120" height="10" rx="3"/>
    <rect x="740" y="52" width="120" height="10" rx="3"/>
    <rect x="1180" y="70" width="120" height="10" rx="3"/>
  </g>

  <!-- the pitch, tilting up out of the dark -->
  <path d="M0 470 L1600 470 L1600 900 L0 900 Z" fill="url(#pitch)"/>
  <!-- mown stripes -->
  <g opacity="0.14" fill="#eaf3ea">
    <path d="M0 560 L1600 560 L1600 610 L0 610 Z"/>
    <path d="M0 690 L1600 690 L1600 760 L0 760 Z"/>
  </g>
  <!-- touchline -->
  <rect x="0" y="512" width="1600" height="3" fill="#dfe8df" opacity="0.35"/>

  <!-- a low dawn/new-era warmth rising at the base -->
  <rect x="0" y="470" width="1600" height="430" fill="url(#dawn)"/>

  <!-- soft light spill washing down onto the near turf -->
  <path d="M420 470 L1180 470 L1360 900 L240 900 Z" fill="url(#spill)"/>

  <!-- lone figure in the technical area, small in a wide frame -->
  <g transform="translate(792 470)" fill="#0a0f0c" opacity="0.95">
    <ellipse cx="8" cy="66" rx="34" ry="7" fill="#000" opacity="0.5"/>
    <rect x="-9" y="-46" width="18" height="46" rx="7"/>
    <circle cx="0" cy="-54" r="9"/>
    <rect x="-9" y="-30" width="30" height="15" rx="6" transform="rotate(12 -9 -30)"/>
  </g>
  <!-- the figure's long shadow thrown forward, toward the new season -->
  <path d="M792 536 L774 900 L836 900 L816 536 Z" fill="#050807" opacity="0.4"/>

  <!-- faint vignette -->
  <rect x="0" y="0" width="1600" height="900" fill="#000" opacity="0.10"/>
  <radialGradient id="vig" cx="0.5" cy="0.46" r="0.75">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
  </radialGradient>
  <rect x="0" y="0" width="1600" height="900" fill="url(#vig)"/>
</svg>
