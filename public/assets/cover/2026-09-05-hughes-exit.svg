<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Editorial plate: a training-ground office block at dusk, one upper window still lit, a single desk lamp behind the glass, red brake lights of a car leaving the gate along a wet drive.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f1e"/>
      <stop offset="0.55" stop-color="#1a1f36"/>
      <stop offset="1" stop-color="#3a2a33"/>
    </linearGradient>
    <linearGradient id="drive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c26"/>
      <stop offset="1" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6eb61" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f6eb61" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f6eb61" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6eb61" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tail" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4d5a" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#c8102e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c8102e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8102e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c8102e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- low cloud bands -->
  <g fill="#0e1122" opacity="0.7">
    <ellipse cx="300" cy="180" rx="420" ry="46"/>
    <ellipse cx="1150" cy="140" rx="520" ry="40"/>
    <ellipse cx="800" cy="250" rx="700" ry="38" opacity="0.5"/>
  </g>

  <!-- distant treeline -->
  <path d="M0 470 L60 452 L120 466 L180 440 L240 458 L300 446 L360 462 L420 448 L480 460 L540 442 L600 456 L660 444 L720 458 L780 448 L840 460 L900 446 L960 458 L1020 450 L1080 462 L1140 446 L1200 458 L1260 450 L1320 460 L1380 448 L1440 458 L1500 450 L1560 460 L1600 452 L1600 520 L0 520 Z" fill="#0a0d18"/>

  <!-- office block -->
  <g>
    <rect x="880" y="300" width="520" height="230" fill="#12141f"/>
    <rect x="880" y="300" width="520" height="12" fill="#1b1e2c"/>
    <!-- window grid, all dark -->
    <g fill="#0a0b13">
      <rect x="910" y="330" width="60" height="40"/><rect x="990" y="330" width="60" height="40"/><rect x="1070" y="330" width="60" height="40"/><rect x="1150" y="330" width="60" height="40"/><rect x="1230" y="330" width="60" height="40"/><rect x="1310" y="330" width="60" height="40"/>
      <rect x="910" y="390" width="60" height="40"/><rect x="990" y="390" width="60" height="40"/><rect x="1070" y="390" width="60" height="40"/><rect x="1150" y="390" width="60" height="40"/><rect x="1230" y="390" width="60" height="40"/><rect x="1310" y="390" width="60" height="40"/>
      <rect x="910" y="450" width="60" height="40"/><rect x="990" y="450" width="60" height="40"/><rect x="1070" y="450" width="60" height="40"/><rect x="1150" y="450" width="60" height="40"/><rect x="1230" y="450" width="60" height="40"/><rect x="1310" y="450" width="60" height="40"/>
    </g>
    <!-- the one lit window -->
    <rect x="1150" y="330" width="60" height="40" fill="url(#glow)"/>
    <circle cx="1180" cy="352" r="34" fill="url(#lamp)"/>
    <!-- desk lamp silhouette and empty chair -->
    <g fill="#12141f">
      <rect x="1188" y="344" width="3" height="18"/>
      <path d="M1180 344 L1198 344 L1194 338 L1184 338 Z"/>
      <rect x="1160" y="350" width="14" height="12" rx="2"/>
      <rect x="1165" y="362" width="4" height="7"/>
    </g>
  </g>

  <!-- gate posts -->
  <rect x="520" y="440" width="18" height="110" fill="#0a0b13"/>
  <rect x="700" y="440" width="18" height="110" fill="#0a0b13"/>
  <rect x="516" y="436" width="26" height="8" fill="#1b1e2c"/>
  <rect x="696" y="436" width="26" height="8" fill="#1b1e2c"/>

  <!-- wet drive -->
  <path d="M480 900 L610 520 L640 520 L1000 900 Z" fill="url(#drive)"/>
  <!-- tail lights of the leaving car, small, near the gate -->
  <g>
    <circle cx="612" cy="512" r="26" fill="url(#tail)"/>
    <circle cx="640" cy="512" r="26" fill="url(#tail)"/>
    <rect x="606" y="508" width="10" height="5" fill="#ff5a66"/>
    <rect x="636" y="508" width="10" height="5" fill="#ff5a66"/>
    <!-- reflection down the wet tarmac -->
    <path d="M600 520 L560 900 L700 900 L652 520 Z" fill="url(#wet)"/>
  </g>

  <!-- foreground grass verge -->
  <path d="M0 620 C200 600 380 640 480 900 L0 900 Z" fill="#0b1210"/>
  <path d="M1000 900 C1120 700 1350 640 1600 660 L1600 900 Z" fill="#0b1210"/>

  <!-- legibility scrim -->
  <rect width="1600" height="900" fill="url(#scrim)"/>
</svg>
