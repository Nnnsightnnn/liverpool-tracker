<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Editorial plate: a floodlit final night, a trophy plinth and two waiting halves">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070d16"/>
      <stop offset="52%" stop-color="#101b28"/>
      <stop offset="100%" stop-color="#1c0c12"/>
    </linearGradient>
    <radialGradient id="flood" cx="0.5" cy="0.14" r="0.82">
      <stop offset="0%" stop-color="#f6ecd6" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#f6ecd6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f6ecd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.58"/>
      <stop offset="46%" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.66"/>
    </linearGradient>
    <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2a1e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#06110c" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#flood)"/>

  <!-- stadium tiers, abstracted: two facing banks of light -->
  <g opacity="0.22" fill="none" stroke="#f6ecd6" stroke-width="2">
    <path d="M-40 300 Q800 200 1640 300"/>
    <path d="M-40 330 Q800 232 1640 330"/>
    <path d="M-40 362 Q800 266 1640 362"/>
  </g>

  <!-- floodlight pylons -->
  <g opacity="0.5" fill="#f6ecd6">
    <g opacity="0.55">
      <rect x="228" y="118" width="6" height="196"/>
      <rect x="188" y="96" width="86" height="34" rx="4"/>
    </g>
    <g opacity="0.55">
      <rect x="1366" y="118" width="6" height="196"/>
      <rect x="1326" y="96" width="86" height="34" rx="4"/>
    </g>
  </g>
  <g filter="url(#soft)" opacity="0.30" fill="#f6ecd6">
    <ellipse cx="231" cy="113" rx="72" ry="30"/>
    <ellipse cx="1369" cy="113" rx="72" ry="30"/>
  </g>

  <!-- turf -->
  <path d="M0 520 Q800 466 1600 520 L1600 900 L0 900 Z" fill="url(#turf)"/>
  <g opacity="0.10" stroke="#f6ecd6" stroke-width="2" fill="none">
    <path d="M0 592 Q800 546 1600 592"/>
    <path d="M0 676 Q800 634 1600 676"/>
    <path d="M0 776 Q800 738 1600 776"/>
    <path d="M800 500 L800 900"/>
    <circle cx="800" cy="676" r="150"/>
  </g>

  <!-- centre plinth: an empty pedestal where the trophy will stand -->
  <g opacity="0.92">
    <rect x="756" y="596" width="88" height="16" rx="3" fill="#0b0b0d" opacity="0.85"/>
    <rect x="770" y="612" width="60" height="10" rx="2" fill="#0b0b0d" opacity="0.7"/>
    <ellipse cx="800" cy="628" rx="126" ry="16" fill="#000" opacity="0.45"/>
  </g>
  <g filter="url(#soft)" opacity="0.34">
    <ellipse cx="800" cy="590" rx="120" ry="58" fill="#C8102E"/>
  </g>

  <!-- two waiting halves: silhouetted ranks facing the centre -->
  <g fill="#05070a" opacity="0.9">
    <g transform="translate(392 566)">
      <ellipse cx="0" cy="112" rx="46" ry="9" fill="#000" opacity="0.4"/>
      <circle cx="0" cy="4" r="15"/>
      <path d="M-18 22 Q0 12 18 22 L23 78 L-23 78 Z"/>
      <path d="M-16 78 L-9 148 L2 148 L4 92 L8 148 L19 148 L22 78 Z"/>
    </g>
    <g transform="translate(300 588) scale(0.86)">
      <ellipse cx="0" cy="112" rx="46" ry="9" fill="#000" opacity="0.35"/>
      <circle cx="0" cy="4" r="15"/>
      <path d="M-18 22 Q0 12 18 22 L23 78 L-23 78 Z"/>
      <path d="M-16 78 L-9 148 L2 148 L4 92 L8 148 L19 148 L22 78 Z"/>
    </g>
    <g transform="translate(1208 566) scale(-1 1)">
      <ellipse cx="0" cy="112" rx="46" ry="9" fill="#000" opacity="0.4"/>
      <circle cx="0" cy="4" r="15"/>
      <path d="M-18 22 Q0 12 18 22 L23 78 L-23 78 Z"/>
      <path d="M-16 78 L-9 148 L2 148 L4 92 L8 148 L19 148 L22 78 Z"/>
    </g>
    <g transform="translate(1300 588) scale(-0.86 0.86)">
      <ellipse cx="0" cy="112" rx="46" ry="9" fill="#000" opacity="0.35"/>
      <circle cx="0" cy="4" r="15"/>
      <path d="M-18 22 Q0 12 18 22 L23 78 L-23 78 Z"/>
      <path d="M-16 78 L-9 148 L2 148 L4 92 L8 148 L19 148 L22 78 Z"/>
    </g>
  </g>

  <!-- the red thread through the middle: one club, both benches -->
  <g opacity="0.5" stroke="#C8102E" stroke-width="3" fill="none">
    <path d="M392 700 Q800 760 1208 700" stroke-dasharray="2 14" stroke-linecap="round"/>
  </g>

  <rect width="1600" height="900" fill="url(#scrim)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055"/>
</svg>
