<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Editorial plate: a single figure in deep-red wheeling away in celebration on a floodlit pitch at night, arms wide, a stadium tier rising behind under cool white light">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="46%" stop-color="#15212e"/>
      <stop offset="100%" stop-color="#2a1a17"/>
    </linearGradient>
    <radialGradient id="flood" cx="0.62" cy="0.12" r="0.7">
      <stop offset="0%" stop-color="#eef3ff" stop-opacity="0.92"/>
      <stop offset="34%" stop-color="#cdd9f0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#cdd9f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#274731"/>
      <stop offset="100%" stop-color="#0d1711"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef3ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#eef3ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd9b0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd9b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- night sky + bowl -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#flood)"/>

  <!-- upper stand tier (baseball-stadium deck, abstracted) -->
  <g opacity="0.9">
    <path d="M0 300 L1600 232 L1600 402 L0 452 Z" fill="#0e161f"/>
    <path d="M0 452 L1600 402 L1600 452 L0 500 Z" fill="#0b1219"/>
    <!-- crowd speckle -->
    <g fill="#39485c" opacity="0.5">
      <rect x="60" y="330" width="1480" height="4"/>
      <rect x="40" y="352" width="1520" height="4"/>
      <rect x="60" y="374" width="1480" height="4"/>
      <rect x="40" y="396" width="1520" height="4"/>
    </g>
  </g>

  <!-- floodlight banks -->
  <g fill="#eef3ff" opacity="0.85">
    <rect x="250" y="150" width="150" height="12" rx="3"/>
    <rect x="1180" y="120" width="170" height="12" rx="3"/>
  </g>
  <polygon points="325,162 60,520 720,520" fill="url(#spill)" opacity="0.5"/>
  <polygon points="1265,132 900,520 1560,520" fill="url(#spill)" opacity="0.6"/>

  <!-- pitch -->
  <path d="M0 500 L1600 452 L1600 900 L0 900 Z" fill="url(#pitch)"/>
  <!-- mown stripes -->
  <g opacity="0.10" fill="#eaf6ec">
    <path d="M0 560 L1600 520 L1600 560 L0 604 Z"/>
    <path d="M0 668 L1600 640 L1600 690 L0 724 Z"/>
    <path d="M0 800 L1600 786 L1600 850 L0 866 Z"/>
  </g>

  <!-- celebration halo on the near turf -->
  <ellipse cx="820" cy="720" rx="360" ry="150" fill="url(#halo)"/>

  <!-- lone figure, arms wide, wheeling away -->
  <g transform="translate(820 640)">
    <!-- long shadow thrown back -->
    <ellipse cx="30" cy="150" rx="150" ry="26" fill="#000" opacity="0.34"/>
    <!-- body in deep red -->
    <g fill="#b31217">
      <!-- torso -->
      <path d="M-24 -40 Q0 -56 24 -40 L30 60 Q0 74 -30 60 Z"/>
      <!-- arms spread wide -->
      <path d="M-22 -30 L-120 -70 L-112 -52 L-16 -8 Z"/>
      <path d="M22 -30 L118 -84 L126 -66 L16 -8 Z"/>
      <!-- legs, mid-stride -->
      <path d="M-14 58 L-40 156 L-22 158 L2 70 Z"/>
      <path d="M14 58 L40 150 L58 148 L22 70 Z"/>
    </g>
    <!-- head -->
    <circle cx="0" cy="-58" r="17" fill="#e7b98f"/>
    <!-- rim light on the shoulders -->
    <path d="M-24 -40 Q0 -56 24 -40" fill="none" stroke="#ffe0bd" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- faint figures behind (teammates arriving) -->
  <g fill="#7a1418" opacity="0.5">
    <path d="M1040 620 q10 -8 20 0 l6 78 q-16 8 -32 0 Z"/>
    <circle cx="1050" cy="606" r="10"/>
    <path d="M1110 636 q10 -8 20 0 l6 70 q-16 8 -32 0 Z"/>
    <circle cx="1120" cy="624" r="9"/>
  </g>

  <!-- grain / vignette -->
  <rect width="1600" height="900" fill="#000" opacity="0.05"/>
  <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
