<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Five figures in deep red stand together on a floodlit pitch at night beneath a bank of stadium light.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="0.55" stop-color="#12070a"/>
      <stop offset="1" stop-color="#1c0a0e"/>
    </linearGradient>
    <radialGradient id="floods" cx="0.5" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#ffe9c2" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#e7b878" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e7b878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a1c"/>
      <stop offset="1" stop-color="#06180c"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8102e"/>
      <stop offset="1" stop-color="#7d0a1c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#floods)"/>

  <!-- floodlight pylons / upper tier suggestion -->
  <g opacity="0.5">
    <rect x="120" y="150" width="240" height="10" rx="4" fill="#ffedcb" opacity="0.35" filter="url(#soft)"/>
    <rect x="620" y="120" width="360" height="12" rx="5" fill="#fff3da" opacity="0.45" filter="url(#soft)"/>
    <rect x="1240" y="150" width="240" height="10" rx="4" fill="#ffedcb" opacity="0.35" filter="url(#soft)"/>
    <rect x="0" y="255" width="1600" height="70" fill="#000000" opacity="0.35"/>
  </g>

  <!-- pitch -->
  <path d="M0 560 L1600 500 L1600 900 L0 900 Z" fill="url(#pitch)"/>
  <g stroke="#e9ffe9" stroke-opacity="0.06" stroke-width="2">
    <line x1="0" y1="640" x2="1600" y2="600"/>
    <line x1="0" y1="740" x2="1600" y2="710"/>
    <line x1="0" y1="850" x2="1600" y2="835"/>
  </g>

  <!-- long shadows -->
  <g fill="#000000" opacity="0.32" filter="url(#soft)">
    <ellipse cx="470" cy="690" rx="70" ry="16"/>
    <ellipse cx="640" cy="700" rx="72" ry="16"/>
    <ellipse cx="810" cy="705" rx="76" ry="17"/>
    <ellipse cx="985" cy="700" rx="72" ry="16"/>
    <ellipse cx="1150" cy="690" rx="70" ry="16"/>
  </g>

  <!-- the spine: five figures standing shoulder to shoulder -->
  <g fill="url(#figure)">
    <g transform="translate(470,690)">
      <circle cx="0" cy="-150" r="24"/>
      <path d="M-30 -128 Q0 -138 30 -128 L26 -18 Q0 -8 -26 -18 Z"/>
      <rect x="-24" y="-20" width="18" height="22" rx="6"/>
      <rect x="6" y="-20" width="18" height="22" rx="6"/>
    </g>
    <g transform="translate(640,700)">
      <circle cx="0" cy="-158" r="25"/>
      <path d="M-32 -134 Q0 -145 32 -134 L28 -16 Q0 -6 -28 -16 Z"/>
      <rect x="-26" y="-18" width="19" height="22" rx="6"/>
      <rect x="7" y="-18" width="19" height="22" rx="6"/>
    </g>
    <g transform="translate(810,706)">
      <circle cx="0" cy="-166" r="27"/>
      <path d="M-34 -140 Q0 -152 34 -140 L30 -14 Q0 -4 -30 -14 Z"/>
      <rect x="-27" y="-16" width="20" height="23" rx="6"/>
      <rect x="7" y="-16" width="20" height="23" rx="6"/>
    </g>
    <g transform="translate(985,700)">
      <circle cx="0" cy="-158" r="25"/>
      <path d="M-32 -134 Q0 -145 32 -134 L28 -16 Q0 -6 -28 -16 Z"/>
      <rect x="-26" y="-18" width="19" height="22" rx="6"/>
      <rect x="7" y="-18" width="19" height="22" rx="6"/>
    </g>
    <g transform="translate(1150,690)">
      <circle cx="0" cy="-150" r="24"/>
      <path d="M-30 -128 Q0 -138 30 -128 L26 -18 Q0 -8 -26 -18 Z"/>
      <rect x="-24" y="-20" width="18" height="22" rx="6"/>
      <rect x="6" y="-20" width="18" height="22" rx="6"/>
    </g>
  </g>

  <!-- rim light on the figures -->
  <g fill="#ffd9a0" opacity="0.20">
    <circle cx="810" cy="540" r="30"/>
  </g>

  <!-- vignette for masthead legibility at top -->
  <rect width="1600" height="360" fill="#000000" opacity="0.28"/>
</svg>
