<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Editorial plate: a departure whose destination is unsettled">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1620"/>
      <stop offset="55%" stop-color="#12222c"/>
      <stop offset="100%" stop-color="#1a0d12"/>
    </linearGradient>
    <radialGradient id="flood" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0%" stop-color="#f4e9d2" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#f4e9d2" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f4e9d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.62"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#flood)"/>

  <!-- horizon: bridge cables and minaret domes, abstracted -->
  <g opacity="0.30" fill="none" stroke="#C8102E" stroke-width="2">
    <path d="M0 560 C 260 470, 520 470, 780 560" />
    <path d="M780 560 C 1040 470, 1300 470, 1600 560" />
  </g>
  <g opacity="0.22" fill="#f4e9d2">
    <path d="M300 560 q22 -60 44 0 z"/>
    <rect x="316" y="500" width="4" height="60"/>
    <path d="M1180 560 q28 -74 56 0 z"/>
    <rect x="1206" y="486" width="4" height="74"/>
    <circle cx="480" cy="536" r="4"/><circle cx="1020" cy="524" r="4"/>
    <circle cx="150" cy="540" r="3"/><circle cx="1420" cy="534" r="3"/>
  </g>

  <!-- pitch -->
  <g opacity="0.16" stroke="#f4e9d2" stroke-width="2" fill="none">
    <path d="M-40 900 L 620 566 L 980 566 L 1640 900 Z"/>
    <path d="M330 733 L 1270 733"/>
    <ellipse cx="800" cy="733" rx="150" ry="52"/>
  </g>

  <!-- lone figure walking away -->
  <g fill="#0a0f14" opacity="0.92" transform="translate(800 640) scale(1.5)">
    <ellipse cx="0" cy="64" rx="26" ry="6" fill="#000" opacity="0.35"/>
    <circle cx="0" cy="-4" r="9"/>
    <path d="M-9 8 q9 -6 18 0 l4 30 h-10 l-3 -18 -3 18 h-10 z"/>
    <path d="M-9 12 l-9 22 3 2 10 -20 z"/>
    <path d="M9 12 l10 20 3 -2 -9 -22 z"/>
    <path d="M-6 38 l-3 26 h8 l2 -24 z"/>
    <path d="M6 38 l4 26 h-8 l-2 -24 z"/>
  </g>

  <!-- two diverging routes: one abandoned, one unconfirmed -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M800 700 C 980 690, 1180 700, 1420 676" stroke="#C8102E" opacity="0.55" stroke-dasharray="10 14"/>
    <path d="M800 700 C 620 690, 420 700, 180 676" stroke="#f4e9d2" opacity="0.16" stroke-dasharray="3 20"/>
  </g>

  <rect width="1600" height="900" fill="url(#scrim)"/>
  <rect x="0" y="884" width="1600" height="16" fill="#C8102E" opacity="0.75"/>
</svg>
