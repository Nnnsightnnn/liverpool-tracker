<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Editorial plate: a floodlit Anfield night, a lone midfielder in red mid-strike twenty yards out, the ball a streak toward the top corner, a steep bank of red supporters and white floodlights behind the goal.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a16"/>
      <stop offset="0.6" stop-color="#121a33"/>
      <stop offset="1" stop-color="#1c2340"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a0f1c"/>
      <stop offset="1" stop-color="#8f1428"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5a33"/>
      <stop offset="1" stop-color="#0d2e1a"/>
    </linearGradient>
    <radialGradient id="flood" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#f6f1d6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6f1d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f1e" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0f1e" stop-opacity="0.75"/>
    </linearGradient>
    <pattern id="crowd" width="14" height="10" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="2.2" fill="#c8102e" opacity="0.55"/>
      <circle cx="11" cy="2" r="1.8" fill="#f4ebd0" opacity="0.18"/>
      <circle cx="9" cy="8" r="2" fill="#a80f26" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- night sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stand roof line -->
  <polygon points="0,150 1600,120 1600,170 0,200" fill="#0a0d19"/>

  <!-- floodlights along the roof -->
  <g>
    <circle cx="260" cy="132" r="120" fill="url(#flood)"/>
    <circle cx="640" cy="122" r="130" fill="url(#flood)"/>
    <circle cx="1020" cy="114" r="130" fill="url(#flood)"/>
    <circle cx="1390" cy="106" r="120" fill="url(#flood)"/>
    <rect x="252" y="124" width="16" height="10" fill="#ffffff"/>
    <rect x="632" y="114" width="16" height="10" fill="#ffffff"/>
    <rect x="1012" y="106" width="16" height="10" fill="#ffffff"/>
    <rect x="1382" y="98" width="16" height="10" fill="#ffffff"/>
  </g>

  <!-- the Kop: steep bank behind the goal -->
  <polygon points="0,200 1600,170 1600,470 0,500" fill="url(#stand)"/>
  <polygon points="0,200 1600,170 1600,470 0,500" fill="url(#crowd)"/>
  <rect x="0" y="380" width="1600" height="130" fill="url(#haze)"/>

  <!-- pitch -->
  <rect x="0" y="500" width="1600" height="400" fill="url(#grass)"/>
  <g stroke="#f4ebd0" stroke-opacity="0.35" stroke-width="3" fill="none">
    <line x1="0" y1="640" x2="1600" y2="640"/>
    <rect x="520" y="500" width="560" height="140"/>
    <rect x="690" y="500" width="220" height="56"/>
    <circle cx="800" cy="720" r="5" fill="#f4ebd0" fill-opacity="0.35" stroke="none"/>
  </g>
  <!-- mown stripes -->
  <g fill="#f4ebd0" fill-opacity="0.03">
    <rect x="0" y="500" width="1600" height="50"/>
    <rect x="0" y="600" width="1600" height="50"/>
    <rect x="0" y="700" width="1600" height="50"/>
    <rect x="0" y="800" width="1600" height="50"/>
  </g>

  <!-- goal frame -->
  <g stroke="#f4ebd0" stroke-width="6" fill="none">
    <line x1="700" y1="500" x2="700" y2="410"/>
    <line x1="900" y1="500" x2="900" y2="410"/>
    <line x1="700" y1="410" x2="900" y2="410"/>
  </g>
  <!-- net -->
  <g stroke="#f4ebd0" stroke-opacity="0.18" stroke-width="1">
    <line x1="700" y1="425" x2="900" y2="425"/><line x1="700" y1="440" x2="900" y2="440"/><line x1="700" y1="455" x2="900" y2="455"/>
    <line x1="700" y1="470" x2="900" y2="470"/><line x1="700" y1="485" x2="900" y2="485"/>
    <line x1="720" y1="410" x2="720" y2="500"/><line x1="740" y1="410" x2="740" y2="500"/><line x1="760" y1="410" x2="760" y2="500"/>
    <line x1="780" y1="410" x2="780" y2="500"/><line x1="800" y1="410" x2="800" y2="500"/><line x1="820" y1="410" x2="820" y2="500"/>
    <line x1="840" y1="410" x2="840" y2="500"/><line x1="860" y1="410" x2="860" y2="500"/><line x1="880" y1="410" x2="880" y2="500"/>
  </g>

  <!-- goalkeeper, diving to his right, beaten -->
  <g transform="translate(830,470) rotate(-28)">
    <rect x="-14" y="-34" width="28" height="60" rx="10" fill="#1f2a44"/>
    <circle cx="0" cy="-46" r="12" fill="#e8c9a8"/>
    <rect x="12" y="-30" width="46" height="10" rx="5" fill="#1f2a44"/>
    <rect x="-52" y="-22" width="40" height="10" rx="5" fill="#1f2a44"/>
    <rect x="-16" y="22" width="12" height="40" rx="5" fill="#1f2a44"/>
    <rect x="4" y="22" width="12" height="40" rx="5" fill="#1f2a44"/>
  </g>

  <!-- ball streak toward the top corner -->
  <path d="M 560 760 Q 700 560 886 430" stroke="url(#streak)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="888" cy="428" r="9" fill="#ffffff"/>

  <!-- the striker, twenty yards out, body coiled through a left-footed shot -->
  <g transform="translate(540,790)">
    <!-- planted right leg -->
    <rect x="-6" y="-40" width="16" height="70" rx="7" fill="#f4ebd0" transform="rotate(12)"/>
    <!-- striking left leg, following through -->
    <rect x="-8" y="-46" width="16" height="78" rx="7" fill="#f4ebd0" transform="rotate(-62)"/>
    <rect x="-8" y="26" width="16" height="14" rx="4" fill="#c8102e" transform="rotate(-62)"/>
    <!-- shorts -->
    <rect x="-22" y="-62" width="44" height="30" rx="8" fill="#c8102e"/>
    <!-- torso, twisted -->
    <rect x="-24" y="-124" width="48" height="70" rx="14" fill="#c8102e" transform="rotate(-10)"/>
    <!-- arms out for balance -->
    <rect x="18" y="-118" width="60" height="14" rx="7" fill="#c8102e" transform="rotate(-38)"/>
    <rect x="-84" y="-100" width="58" height="14" rx="7" fill="#c8102e" transform="rotate(22)"/>
    <!-- head -->
    <circle cx="-4" cy="-140" r="16" fill="#e8c9a8"/>
    <circle cx="-4" cy="-148" r="14" fill="#3a2a1f"/>
  </g>

  <!-- pitch glow around the striker -->
  <ellipse cx="540" cy="830" rx="150" ry="22" fill="#000" opacity="0.35"/>

  <!-- foreground haze -->
  <rect x="0" y="780" width="1600" height="120" fill="url(#haze)"/>
</svg>
