<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Editorial plate: a single figure standing alone on the wing of an empty floodlit pitch at dusk, the shirt waiting to be filled">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f141d"/>
      <stop offset="46%" stop-color="#1f2c3c"/>
      <stop offset="100%" stop-color="#37241c"/>
    </linearGradient>
    <radialGradient id="flood" cx="0.72" cy="0.16" r="0.72">
      <stop offset="0%" stop-color="#f4e0b0" stop-opacity="0.40"/>
      <stop offset="50%" stop-color="#f4e0b0" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#f4e0b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24402c"/>
      <stop offset="100%" stop-color="#132015"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d12" stop-opacity="0.62"/>
      <stop offset="38%" stop-color="#0a0d12" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0d12" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#flood)"/>

  <!-- distant stand, dissolving into haze -->
  <rect x="0" y="300" width="1600" height="150" fill="#151d29" opacity="0.72"/>
  <g fill="#f4e0b0" opacity="0.10">
    <circle cx="1150" cy="150" r="70"/>
    <circle cx="1360" cy="120" r="52"/>
  </g>

  <!-- the pitch, receding -->
  <polygon points="0,470 1600,470 1600,900 0,900" fill="url(#pitch)"/>
  <!-- mown stripes -->
  <g opacity="0.10" fill="#3e6b47">
    <polygon points="120,470 300,470 90,900 -240,900"/>
    <polygon points="520,470 700,470 700,900 340,900"/>
    <polygon points="920,470 1100,470 1240,900 780,900"/>
    <polygon points="1320,470 1500,470 1840,900 1360,900"/>
  </g>
  <!-- touchline sweeping to the wing -->
  <path d="M -40 520 Q 800 500 1660 560" stroke="#cfd6dc" stroke-width="3" fill="none" opacity="0.28"/>
  <line x1="1300" y1="470" x2="1420" y2="900" stroke="#cfd6dc" stroke-width="3" opacity="0.20"/>

  <!-- a single figure, alone on the wing -->
  <g opacity="0.9">
    <ellipse cx="1250" cy="676" rx="60" ry="10" fill="#000" opacity="0.32"/>
    <path d="M1250 574
             c-10 0 -17 8 -17 20
             c0 9 4 15 4 24
             l-9 44 c-1 8 11 10 13 2 l7 -34 4 0 7 34
             c2 8 14 6 13 -2 l-9 -44 c0 -9 4 -15 4 -24
             c0 -12 -7 -20 -17 -20 z" fill="#0b0e13"/>
    <circle cx="1250" cy="558" r="11" fill="#0b0e13"/>
    <!-- long dusk shadow cast across the empty flank -->
    <path d="M1250 676 L980 700 L1010 712 L1268 686 Z" fill="#000" opacity="0.18"/>
  </g>

  <rect width="1600" height="900" fill="url(#scrim)"/>
</svg>
