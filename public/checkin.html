<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quick Security Check-in</title>
<style>
  :root{
    --bg:#0f1413; --card:#1a2220; --ink:#eef2f1; --muted:#9fb0ac;
    --accent:#4fd1a5; --accent2:#2f8e72; --line:#2a3633; --pick:#16302a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45}
  .wrap{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding:max(16px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 22px}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));
    border-radius:99px;transition:width .25s ease}
  .step{flex:1;display:flex;flex-direction:column;justify-content:center;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .eyebrow{color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
  h1{font-size:25px;margin:0 0 6px;font-weight:700}
  h2{font-size:21px;margin:0 0 14px;font-weight:650;line-height:1.3}
  p.lead{color:var(--muted);font-size:15.5px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);
    border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;margin:9px 0;font-size:16px;
    cursor:pointer;transition:.12s}
  .opt:active{transform:scale(.99)}
  .opt.sel{border-color:var(--accent);background:var(--pick)}
  .opt .chk{float:right;color:var(--accent);font-weight:700;opacity:0;transition:.12s}
  .opt.sel .chk{opacity:1}
  textarea{width:100%;background:var(--card);color:var(--ink);border:1.5px solid var(--line);
    border-radius:14px;padding:14px;font-size:16px;font-family:inherit;min-height:96px;resize:vertical}
  input[type=text]{width:100%;background:var(--card);color:var(--ink);border:1.5px solid var(--line);
    border-radius:14px;padding:15px 16px;font-size:17px;font-family:inherit}
  .nav{display:flex;gap:10px;margin-top:22px}
  button.btn{flex:1;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:650;cursor:pointer}
  .next{background:var(--accent);color:#06231b}
  .next:disabled{opacity:.4}
  .back{flex:0 0 auto;background:transparent;color:var(--muted);border:1.5px solid var(--line)}
  .send{display:block;width:100%;text-align:center;text-decoration:none;background:var(--accent);
    color:#06231b;border-radius:14px;padding:17px;font-size:18px;font-weight:700;margin:6px 0 12px}
  .copy{display:block;width:100%;background:transparent;border:1.5px solid var(--line);color:var(--muted);
    border-radius:14px;padding:13px;font-size:15px;cursor:pointer}
  .count{color:var(--muted);font-size:13px;text-align:center;margin-bottom:4px}
  .ok{color:var(--accent);font-size:14px;text-align:center;height:18px;margin-top:8px}
  small.hint{color:var(--muted);font-size:13.5px;display:block;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><i id="prog"></i></div>
  <div class="count" id="count"></div>
  <div class="step" id="step"></div>
</div>

<script>
const RECIPIENT = "kjautry@gmail.com";

// Questions. type: 'name' | 'choice' | 'text'
const Q = [
  {intro:true,
    title:"Quick security check-in",
    lead:"Kenny's tidying up the family's online safety (the “just in case my phone dies” stuff). This is ~9 quick taps, about your LastPass and logins. Your answers go straight to him — no passwords, ever."},

  {key:"who", type:"name", q:"First, who's filling this out?"},

  {key:"devices", type:"choice", q:"Where do you actually use LastPass?",
    opts:["My phone","My computer","Both phone and computer","Honestly not sure"]},

  {key:"autofill", type:"choice", q:"When you log into a site, does LastPass fill your password in for you?",
    opts:["Yes, works great","Sometimes — it's hit or miss","Rarely — I usually copy/paste or retype","I don't really use it"]},

  {key:"reuse", type:"choice", q:"Your LastPass master password (the one that unlocks everything) — do you use it anywhere else too?",
    opts:["No, it's only for LastPass","Yes, I reuse it on other things","Not sure"]},

  {key:"memory", type:"choice", q:"If your phone reset today, could you log into LastPass from memory?",
    opts:["Yes, I know it","No — I'd be locked out","Not sure"]},

  {key:"lp2fa", type:"choice", q:"Is two-step / two-factor login turned on for LastPass?",
    opts:["Yes","No","I don't know what that is / not sure"]},

  {key:"email2fa", type:"choice", q:"Same question for your main email (Gmail / iCloud) — two-step login on?",
    opts:["Yes","No","Not sure"]},

  {key:"codes", type:"choice", q:"Have you ever saved “backup codes” for your important accounts (printed or written down)?",
    opts:["Yes, somewhere safe","No","What are backup codes?"]},

  {key:"switch", type:"choice", q:"Would you be open to Kenny moving you to a safer password app (and setting it up for you)?",
    opts:["Yes, please","Maybe — tell me more","No, I'm happy with LastPass"]},

  {key:"gripes", type:"text", q:"Anything about LastPass (or logging in generally) that annoys or confuses you?",
    hint:"Optional — totally fine to skip."}
];

let i = 0;
const A = {};
const elStep = document.getElementById('step');
const elProg = document.getElementById('prog');
const elCount = document.getElementById('count');

function render(){
  const item = Q[i];
  elProg.style.width = (i/(Q.length-1)*100) + "%";
  elCount.textContent = item.intro ? "" : `Question ${i} of ${Q.length-1}`;
  let h = "";

  if(item.intro){
    h += `<div class="eyebrow">For Carrie & Angela</div>`;
    h += `<h1>${item.title}</h1><p class="lead">${item.lead}</p>`;
    h += `<div class="nav"><button class="btn next" onclick="go(1)">Start →</button></div>`;
  }
  else if(item.type==="name"){
    const v = A[item.key]||"";
    h += `<h2>${item.q}</h2>`;
    h += `<div class="opt ${v==='Carrie'?'sel':''}" onclick="pickName('Carrie')">Carrie<span class="chk">✓</span></div>`;
    h += `<div class="opt ${v==='Angela'?'sel':''}" onclick="pickName('Angela')">Angela<span class="chk">✓</span></div>`;
    h += `<input type="text" id="nameIn" placeholder="…or type your name" value="${v!=='Carrie'&&v!=='Angela'?v:''}" oninput="A['who']=this.value;refreshNext()">`;
    h += navHTML();
  }
  else if(item.type==="choice"){
    h += `<h2>${item.q}</h2>`;
    item.opts.forEach(o=>{
      h += `<div class="opt ${A[item.key]===o?'sel':''}" onclick="pick('${item.key}', this)" data-v="${o}">${o}<span class="chk">✓</span></div>`;
    });
    h += navHTML();
  }
  else if(item.type==="text"){
    h += `<h2>${item.q}</h2>`;
    h += `<textarea oninput="A['${item.key}']=this.value">${A[item.key]||""}</textarea>`;
    if(item.hint) h += `<small class="hint">${item.hint}</small>`;
    h += navHTML(true);
  }
  elStep.innerHTML = h;
  refreshNext();
}

function navHTML(lastIsText){
  const last = (i === Q.length-1);
  const label = last ? "Finish →" : "Next →";
  return `<div class="nav">
    <button class="btn back" onclick="go(-1)">←</button>
    <button class="btn next" id="nextBtn" onclick="${last?'finish()':'go(1)'}">${label}</button>
  </div>`;
}

function pick(key, el){
  A[key] = el.getAttribute('data-v');
  [...el.parentNode.querySelectorAll('.opt')].forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  refreshNext();
  setTimeout(()=>{ if(i < Q.length-1) go(1); }, 220); // auto-advance, snappy
}
function pickName(n){ A['who']=n; render(); setTimeout(()=>go(1),220); }

function refreshNext(){
  const item = Q[i];
  const btn = document.getElementById('nextBtn');
  if(!btn) return;
  if(item.type==="choice"){ btn.disabled = !A[item.key]; }
  else if(item.type==="name"){ btn.disabled = !(A['who']&&A['who'].trim()); }
  else btn.disabled = false;
}

function go(d){
  const ni = i + d;
  if(ni < 0 || ni >= Q.length) return;
  i = ni; render(); window.scrollTo(0,0);
}

function buildBody(){
  let lines = ["Digital security check-in — answers below.\n"];
  Q.forEach(item=>{
    if(item.intro) return;
    const label = item.type==="name" ? "Name" : item.q;
    const ans = A[item.key] ? A[item.key] : "(skipped)";
    lines.push(`• ${label}\n   ${ans}\n`);
  });
  return lines.join("\n");
}

function finish(){
  const who = A['who'] || "Someone";
  const subject = `Security check-in — ${who}`;
  const body = buildBody();
  const mailto = `mailto:${RECIPIENT}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  elProg.style.width = "100%";
  elCount.textContent = "";
  elStep.innerHTML = `
    <div class="eyebrow">Almost done</div>
    <h1>Thanks, ${who.split(' ')[0]} — one tap left</h1>
    <p class="lead">This opens an email to Kenny with your answers filled in. Just hit send.</p>
    <a class="send" href="${mailto}">✉️  Send my answers to Kenny</a>
    <button class="copy" onclick="copyAns(this)">Email not opening? Tap to copy answers instead</button>
    <div class="ok" id="ok"></div>`;
  window._body = body;
}

function copyAns(btn){
  const t = window._body || buildBody();
  navigator.clipboard.writeText(t).then(()=>{
    document.getElementById('ok').textContent = "Copied — paste it in a text to Kenny.";
  }).catch(()=>{
    document.getElementById('ok').textContent = "Couldn't copy — screenshot this and send it instead.";
  });
}

render();
</script>
</body>
</html>
