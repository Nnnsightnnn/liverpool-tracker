<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liverpool FC Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://nnnsightnnn.github.io/tracker-shared/live-scores.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #1a1a2e; }
      ::-webkit-scrollbar-thumb { background: #C8102E55; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #C8102E88; }

      /* ── Live score box — overrides for tracker-shared/live-scores.css ── */
      /* Matches Liverpool FC Tracker dark/red/gold card aesthetic */
      #score-box .ls-card {
        background: linear-gradient(135deg, #1e1e3a, #2a1525);
        border: 1px solid #ffffff15;
        border-radius: 16px;
        padding: 18px 20px;
        color: #fff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        box-shadow: 0 4px 24px #C8102E22;
      }
      #score-box .ls-card[data-state="in"] {
        border-left: 4px solid #C8102E;
        box-shadow: 0 4px 28px #C8102E55;
      }
      #score-box .ls-card[data-state="post"] { border-left: 4px solid #F6EB61; }
      #score-box .ls-card[data-state="pre"]  { border-left: 4px solid #ffffff33; }
      #score-box .ls-status {
        font-size: 11px;
        color: #F6EB61;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 10px;
      }
      #score-box .ls-card[data-state="pre"] .ls-status { color: #ffffffaa; }
      #score-box .ls-teams {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #score-box .ls-team {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 12px;
        background: #ffffff08;
        border-radius: 8px;
      }
      #score-box .ls-abbr {
        font-weight: 700;
        font-size: 14px;
        color: #fff;
        letter-spacing: 0.5px;
      }
      #score-box .ls-score {
        font-variant-numeric: tabular-nums;
        font-weight: 800;
        font-size: 22px;
        color: #F6EB61;
      }
      #score-box .ls-card[data-state="pre"] .ls-score { color: #ffffff66; font-size: 16px; }
      #score-box .ls-live {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #C8102E;
        border-radius: 50%;
        margin-right: 4px;
        animation: ls-pulse 1.2s infinite;
        box-shadow: 0 0 8px #C8102E;
      }
      #score-box .ls-events {
        list-style: none;
        padding: 10px 0 0;
        margin-top: 12px;
        border-top: 1px solid #ffffff15;
        font-size: 11px;
        color: #bbb;
      }
      #score-box .ls-events li {
        padding: 3px 0;
        color: #ddd;
      }
      #score-box .ls-empty {
        color: #888;
        font-size: 12px;
        text-align: center;
        padding: 14px;
        background: #1e1e3a;
        border-radius: 12px;
        border: 1px dashed #ffffff15;
        font-family: 'Inter', sans-serif;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="score-box" style="max-width: 1400px; margin: 16px auto 0; padding: 0 16px;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="/live-scores-init.js"></script>
  </body>
</html>
